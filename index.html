<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="./css/style.css" rel="stylesheet">
  <link href="./css/query.css" rel="stylesheet">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>

  <main class="result-page">
    <article>
      <section class="heading">
        <div class="top-head">Your Result</div>
        <div class="score">
          <h1 class="score-number">76</h1>
          <p class="score-total">of 100</p>
        </div>
        <div class="last-head">Great</div>
        <p class="score-result">You scored higher than 65% of the people who have taken these tests.</p>
      </section>
      <section class="summary">
        <div class="section-topic"> <strong>Summary</strong></div>
        <div class="flex-items">
          <div class="reaction">
            <div class="img"><img src="./assets/images/icon-reaction.svg" alt="" class="reaction-icon"/></div> 
            <div class="name">Reaction</div>
            <div class="mark"> <strong>80</strong> <span class="hundred">/ 100</span></div>
          </div>
          <div class="memory">
             <div class="img-1"><img src="./assets/images/icon-memory.svg" alt="" class="memory-icon"></div>
             <div class="name-1">Memory</div>
             <div class="mark-1"><strong>92</strong> <span class="hundred">/ 100</span></div>
          </div>
          <div class="verbal">
            <div class="img-2"><img src="/assets/images/icon-verbal.svg" alt="" class="verbal-icon"></div>
            <div class="name-2">Verbal</div>
            <div class="mark-2"><strong>61</strong> <span class="hundred">/ 100</span></div>
          </div>
          <div class="visual">
            <div class="img-3"><img src="/assets/images/icon-visual.svg" alt="" class="visual-icon"></div>
            <div class="name-3">Visual</div>
            <div class="mark-3"><strong>73</strong> <span class="hundred">/ 100</span></div>
          </div>
        </div>

        <button class="continue-button">Continue</button>
      </section>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/emmyprogrammer" target="_blank">Lawal Emmanuel</a>.
  </footer>
</body>
</html>
